# Open in Terminal — appears when the selection is a path that exists. Opens a Terminal window
# in that folder (or in the folder containing a selected file).
name: Open in Terminal
identifier: dev.saibarath.glint.open-in-terminal
description: Open a Terminal window at the selected folder path (or the folder of a selected file).
icon: symbol:apple.terminal
requirements: [path]
shell script: |
  # Use the first line that is an existing path (the action appears when any line is one).
  target=""
  while IFS= read -r line || [ -n "$line" ]; do
    p=$(printf '%s' "$line" | /usr/bin/sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
    p=${p#\"}; p=${p%\"}; p=${p#\'}; p=${p%\'}
    case "$p" in
      "~"*) p="$HOME${p#\~}" ;;
      file://*) p=$(/usr/bin/osascript -l JavaScript -e 'function run(a) { return decodeURIComponent(a[0].replace(/^file:\/\//, "")) }' "$p") ;;
    esac
    case "$p" in /*) ;; *) continue ;; esac  # only absolute paths, like the path detector
    if [ -e "$p" ]; then target="$p"; break; fi
  done
  [ -n "$target" ] || { echo "The selection doesn't contain an existing path" >&2; exit 1; }
  [ -d "$target" ] || target=$(/usr/bin/dirname "$target")
  /usr/bin/open -a Terminal "$target"

# Wrap — surround the selection with quotes or brackets. Whitespace at the edges of the
# selection is kept outside the wrapper (trim is off so the script sees it).
name: Wrap
identifier: dev.saibarath.glint.wrap
description: Wrap the selection in “quotes”, (parentheses), [brackets] or `backticks`.
icon: symbol:quote.opening
after: paste-result
actions:
  - title: Quotes
    icon: symbol:quote.opening
    trim: false
    javascript: |
      var m = glint.input.text.match(/^(\s*)([\s\S]*?)(\s*)$/);
      return m[1] + '“' + m[2] + '”' + m[3];
  - title: Parentheses
    icon: symbol:parentheses
    trim: false
    javascript: |
      var m = glint.input.text.match(/^(\s*)([\s\S]*?)(\s*)$/);
      return m[1] + '(' + m[2] + ')' + m[3];
  - title: Brackets
    icon: text:[ ]
    trim: false
    javascript: |
      var m = glint.input.text.match(/^(\s*)([\s\S]*?)(\s*)$/);
      return m[1] + '[' + m[2] + ']' + m[3];
  - title: Backticks
    icon: text:` `
    trim: false
    javascript: |
      var m = glint.input.text.match(/^(\s*)([\s\S]*?)(\s*)$/);
      var fence = m[2].indexOf('\n') >= 0 ? '```' : '`';
      var body = fence === '```' ? '\n' + m[2] + '\n' : m[2];
      return m[1] + fence + body + fence + m[3];
